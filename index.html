<!DOCTYPE html>
<html lang="uk" data-theme="military">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>KYIV OSINT RADAR v15.6</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
:root, [data-theme="military"]{
  --bg:#050a10; --panel:rgba(8,16,24,.92); --panel-solid:#0b1520;
  --text:#e8f0f5; --muted:#7a8f9e; --accent:#22d3ee; --accent-soft:rgba(34,211,238,.15);
  --danger:#ef4444; --ok:#34d399; --warn:#fbbf24;
  --border:rgba(34,211,238,.18); --header-bg:rgba(5,10,16,.94);
  --btn-bg:rgba(12,22,32,.9); --btn-border:rgba(148,163,184,.22);
  --event-border:#132028; --glow:0 0 12px rgba(34,211,238,.35);
  --radius:12px; --font:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --card-h:0px;
}
body.card-on{--card-h:200px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow:hidden;font-family:var(--font-ui);background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.header{min-height:42px;background:var(--header-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:6px 12px;padding-top:calc(6px + var(--safe-top));z-index:1000;backdrop-filter:blur(16px);flex:0 0 auto;font-size:12px;gap:8px}
.logo{font-weight:800;letter-spacing:.06em;font-size:11px;display:flex;align-items:center;gap:7px;white-space:nowrap;font-family:var(--font)}
.logo-icon{font-size:14px;filter:drop-shadow(0 0 6px var(--accent))}
.header-right{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;min-width:0}
.search-box{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:999px;overflow:hidden;height:32px;flex:1;max-width:260px;min-width:100px}
.search-box input{background:transparent;border:0;color:var(--text);padding:0 12px;font-size:12px;width:100%;outline:none;font-family:var(--font-ui)}
.search-box input::placeholder{color:var(--muted)}
.search-box button{background:transparent;border:0;color:var(--accent);width:34px;height:32px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lang-btn-header{background:var(--btn-bg);border:1px solid var(--border);color:var(--accent);padding:0;border-radius:999px;font-size:11px;line-height:1;cursor:pointer;font-weight:800;min-width:34px;width:34px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:var(--font)}
.lang-btn-header.en{color:var(--ok)}
.status{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap;font-family:var(--font);letter-spacing:.04em}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);transition:background .3s,box-shadow .3s}
.status-dot.err{background:var(--danger);box-shadow:0 0 10px var(--danger)}
.status-dot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.ballistic-timer{display:none;padding:0 10px;height:32px;border-radius:999px;align-items:center;justify-content:center;font-family:var(--font);font-weight:900;font-size:12px;line-height:1;color:#fff;background:#7c2d12;border:2px solid #fca5a5;box-shadow:0 0 12px rgba(220,38,38,.7);letter-spacing:.04em;flex:0 0 auto;min-width:66px;white-space:nowrap;animation:btPulse 1s ease-in-out infinite}
.ballistic-timer.show{display:inline-flex}
@keyframes btPulse{0%,100%{box-shadow:0 0 12px rgba(220,38,38,.7);transform:scale(1)}50%{box-shadow:0 0 24px rgba(220,38,38,1);transform:scale(1.04)}}
.search-results{position:absolute;top:calc(48px + var(--safe-top));right:10px;left:10px;z-index:5000;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);max-width:400px;margin-left:auto;max-height:260px;overflow-y:auto;width:280px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.search-results.show{display:block}
.search-item{padding:9px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid rgba(148,163,184,.12)}
.search-item:hover,.search-item.active{background:rgba(59,130,246,.18)}
.search-item .name{font-weight:700;color:var(--text)}
.search-item .addr{font-size:10px;color:var(--muted);margin-top:2px}
#map{flex:1;min-height:0;width:100%;background:var(--bg)}
[data-theme="military"] #map{background:#dbe4ee}
.top-alert{position:absolute;top:calc(48px + var(--safe-top) + 8px);left:6px;right:6px;z-index:4600;border-radius:10px;overflow:hidden;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.top-alert.show{display:block;animation:alertIn .3s ease-out}
@keyframes alertIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.top-alert.ballistic{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d);color:#fff;animation:bbPulse .6s ease-in-out infinite;border:1px solid #fca5a5}
@keyframes bbPulse{0%,100%{background:linear-gradient(90deg,#7f1d1d,#dc2626,#7f1d1d)}50%{background:linear-gradient(90deg,#dc2626,#fca5a5,#dc2626)}}
.top-alert.impact{background:linear-gradient(90deg,#7c2d12,#ea580c,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert.falling{background:linear-gradient(90deg,#78350f,#f59e0b,#78350f);color:#fff;border:1px solid #fcd34d}
.top-alert.shot{background:linear-gradient(90deg,#14532d,#16a34a,#14532d);color:#fff;border:1px solid #86efac}
.top-alert.fire{background:linear-gradient(90deg,#7c2d12,#f97316,#7c2d12);color:#fff;border:1px solid #fdba74}
.top-alert-inner{padding:9px 34px 9px 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:.86rem;line-height:1.25}
.top-alert-icon{font-size:1.4rem;flex-shrink:0;line-height:1}
.top-alert-body{flex:1;min-width:0}
.top-alert-title{font-weight:800;font-size:.86rem}
.top-alert-place{font-size:.78rem;font-weight:700;margin-top:2px;opacity:.95}
.top-alert-meta{font-size:.68rem;font-weight:700;opacity:.85;margin-top:2px}
.top-alert-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.25);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;cursor:pointer;font-weight:700;padding:0}
.mass-banner{position:absolute;top:calc(36px + var(--safe-top) + 6px);left:6px;right:6px;z-index:4620;border-radius:10px;overflow:hidden;display:none;box-shadow:0 6px 24px rgba(0,0,0,.6);background:linear-gradient(135deg,#4c1d95,#7c3aed,#4c1d95);border:1px solid #c4b5fd;color:#fff}
.mass-banner.show{display:block}
.mass-banner-inner{padding:10px 34px 10px 12px;display:flex;align-items:flex-start;gap:10px;font-weight:700;font-size:.8rem;line-height:1.35}
.mass-banner-icon{font-size:1.5rem}
.mass-banner-body{flex:1;min-width:0}
.mass-banner-title{font-weight:800;font-size:.86rem}
.mass-banner-line{font-size:.74rem;font-weight:700;margin-top:3px;opacity:.95}
.mass-banner-line b{color:#fde047}
.mass-banner-close{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.3);border:0;color:#fff;width:22px;height:22px;border-radius:50%;font-size:1rem;cursor:pointer;padding:0}
.strategic-panel{position:absolute;top:calc(36px + var(--safe-top) + 6px);left:6px;right:6px;z-index:4550;background:rgba(15,23,42,.95);border:1px solid rgba(250,204,21,.5);border-radius:10px;padding:8px 12px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.5);font-size:.72rem;max-height:30vh;overflow-y:auto}
.strategic-panel.show{display:block}
.strategic-panel-title{font-weight:800;color:#facc15;margin-bottom:6px;font-size:.78rem;display:flex;justify-content:space-between;align-items:center}
.strategic-panel-close{background:0;border:0;color:#facc15;font-size:1.1rem;cursor:pointer;padding:0 4px;line-height:1}
.strategic-panel-item{color:#e2e8f0;padding:3px 0;border-bottom:1px solid rgba(148,163,184,.15);display:flex;align-items:flex-start;gap:6px}
.strategic-panel-item .s-ico{flex-shrink:0}
.strategic-panel-item .s-text{flex:1;min-width:0}
.strategic-panel-item .s-eta{color:#fbbf24;font-weight:700;font-size:.68rem}
.strategic-panel-summary{color:#fca5a5;font-weight:800;margin-top:6px;padding-top:6px;border-top:1px solid rgba(220,38,38,.4);font-size:.7rem}
.panel{position:absolute;left:6px;right:6px;bottom:calc(54px + var(--safe-bottom) + var(--card-h));background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;z-index:900;backdrop-filter:blur(18px);display:flex;flex-direction:column;max-height:20vh;transition:max-height .22s ease,bottom .28s;box-shadow:0 8px 32px rgba(0,0,0,.35)}
.panel.collapsed{max-height:40px}
.panel-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;height:40px;flex:0 0 40px}
.panel-title{font-size:12px;font-weight:800;letter-spacing:.06em;display:flex;align-items:center;gap:6px;font-family:var(--font);text-transform:uppercase}
.panel-count{font-size:11px;color:var(--muted);font-weight:700}
.panel-chev{font-size:.7rem;color:var(--muted);transition:transform .2s}
.panel.collapsed .panel-chev{transform:rotate(-90deg)}
.events{overflow-y:auto;flex:1;min-height:0;padding:4px 8px 8px}
.event{padding:10px 12px;margin-bottom:6px;border-radius:10px;border:1px solid var(--event-border);border-left:3px solid var(--accent);cursor:pointer;background:rgba(0,0,0,.2)}
.event:hover{background:var(--accent-soft)}
.event-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.event-type{font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-icon{font-size:13px;line-height:1;flex-shrink:0}
.event-prio{color:var(--warn);font-size:11px}
.event-time{font-size:10px;color:var(--muted);font-weight:700;font-family:var(--font)}
.event-loc{margin-top:3px;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event-meta{margin-top:3px;display:flex;gap:3px;flex-wrap:wrap}
.tag{padding:1px 5px;border-radius:4px;background:#132630;color:#8faab8;font-size:8px;font-weight:700;line-height:1.4}
.tag.prio{background:rgba(251,191,36,.25);color:#fbbf24}
.tag.stage-launch{background:rgba(220,38,38,.3);color:#fecaca}
.tag.stage-impact{background:rgba(220,38,38,.4);color:#fecaca}
.tag.speed{background:rgba(59,130,246,.3);color:#93c5fd}
.tag.strategic{background:rgba(250,204,21,.3);color:#fde047}
.tag.mass{background:rgba(124,58,237,.4);color:#ddd6fe}
.tag.drone-id{background:rgba(239,68,68,.35);color:#fecaca;font-weight:800}
.panel-empty{padding:14px 10px;text-align:center;color:var(--muted);font-size:10px}
.hud-bottom{position:absolute;bottom:calc(14px + var(--safe-bottom) + var(--card-h));left:0;right:0;z-index:1000;padding:0 6px;pointer-events:none;transition:bottom .28s}
.hud-bottom>*{pointer-events:auto}
.btn-row{display:flex;gap:4px;overflow-x:auto;padding:4px 6px;background:var(--panel);border:1px solid var(--border);border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.4);-webkit-overflow-scrolling:touch;scrollbar-width:none;width:100%}
.btn-row::-webkit-scrollbar{display:none}
.btn-row button{border-radius:999px;min-width:36px;height:36px;flex:1;border-color:transparent;background:transparent}
button{background:var(--btn-bg);border:1px solid var(--btn-border);color:var(--text);padding:0;border-radius:var(--radius);font-size:.95rem;line-height:1;cursor:pointer;font-weight:700;min-width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;transition:border-color .15s,box-shadow .15s,background .15s}
button:active{background:var(--accent-soft)}
button.danger{color:#fca5a5}
button.on{border-color:var(--accent);box-shadow:var(--glow);background:var(--accent-soft)}
button.scope-btn.on{color:#22d3ee}
button.siren-btn{color:var(--danger)}
button.siren-btn.active{background:var(--danger)!important;color:#fff!important;animation:sirenFlash .35s ease-in-out infinite;border-color:var(--danger)}
button.infra-btn.infrastructure{border-color:#3b82f6;color:#93c5fd}
button.infra-btn.energy{border-color:var(--warn);color:var(--warn)}
button.infra-btn.incidents{border-color:var(--danger);color:#fca5a5}
button.sound-btn.muted{color:var(--danger);border-color:transparent;background:var(--btn-bg)}
button.sound-btn.on{color:var(--ok)}
button.mass-btn.on{color:#c4b5fd;border-color:#a78bfa}
button.fs-btn.on{background:rgba(99,102,241,.9);color:#fff}
button.visual-btn.on{color:#facc15;border-color:#facc15;box-shadow:0 0 10px rgba(250,204,21,.4)}
@keyframes sirenFlash{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.8)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}
.leaflet-popup-content-wrapper{background:var(--panel-solid);color:var(--text);border-radius:var(--radius);border:1px solid var(--border);box-shadow:0 8px 28px rgba(0,0,0,.55)}
.leaflet-popup-tip{background:rgba(7,16,24,.97)}
.leaflet-popup-content{margin:9px 11px;font-size:.75rem;line-height:1.4;max-width:250px}
.leaflet-popup-close-button{color:#94a3b8!important;font-size:18px!important;padding:2px 6px!important}
.popup-title{font-weight:700;font-size:.82rem;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.popup-meta{color:#94a3b8;font-size:.68rem}
.popup-guess{color:#fbbf24;font-size:.66rem;margin-top:4px}
.popup-channels{margin-top:6px;padding-top:5px;border-top:1px solid rgba(148,163,184,.18);font-size:.66rem}
.popup-channels .ch{display:inline-block;background:rgba(148,163,184,.2);color:#cbd5e1;padding:1px 6px;border-radius:8px;margin:2px 2px 2px 0;border:1px solid rgba(148,163,184,.3)}
.popup-channels .ch.trusted{background:rgba(22,163,74,.25);border-color:rgba(134,239,172,.4);color:#86efac}
.popup-channels .ch.prio{background:rgba(251,191,36,.25);border-color:rgba(251,191,36,.5);color:#fbbf24}
.popup-channels .ch.suspicious{background:rgba(220,38,38,.25);border-color:rgba(248,113,113,.4);color:#fca5a5}
.popup-remove-btn{margin-top:8px;width:100%;height:30px;font-size:.75rem;background:rgba(220,38,38,.25);border:1px solid rgba(248,113,113,.5);color:#fca5a5;border-radius:6px;cursor:pointer;font-weight:800}
.popup-toggle-btn{margin-top:6px;width:100%;height:30px;font-size:.75rem;background:rgba(34,211,238,.2);border:1px solid rgba(34,211,238,.5);color:#67e8f9;border-radius:6px;cursor:pointer;font-weight:800}
.popup-speed{background:rgba(234,88,12,.3);color:#fdba74;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.72rem;display:inline-block;margin-top:4px;border:1px solid rgba(253,186,116,.5)}
.popup-eta{background:rgba(220,38,38,.25);color:#fca5a5;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(248,113,113,.4)}
.popup-dist{background:rgba(59,130,246,.25);color:#93c5fd;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(147,197,253,.4)}
.popup-alt{background:rgba(22,163,74,.25);color:#86efac;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(134,239,172,.4)}
.popup-stale{background:rgba(217,119,6,.25);color:#fcd34d;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.66rem;display:inline-block;margin-top:4px;border:1px solid rgba(251,191,36,.4)}
.popup-exactname{background:rgba(220,38,38,.3);color:#fecaca;padding:3px 6px;border-radius:5px;font-weight:800;font-size:.72rem;display:inline-block;margin-top:4px;border:1px solid rgba(248,113,113,.5)}
.popup-drone-id{background:rgba(239,68,68,.4);color:#fecaca;padding:3px 8px;border-radius:5px;font-weight:900;font-size:.75rem;display:inline-block;margin-top:4px;border:1px solid rgba(248,113,113,.6)}
.popup-route{background:rgba(59,130,246,.2);color:#bfdbfe;padding:4px 8px;border-radius:5px;font-weight:700;font-size:.7rem;display:block;margin-top:4px;border:1px solid rgba(147,197,253,.4)}
.popup-route .arrow{color:#fbbf24;font-weight:900;margin:0 4px}
.popup-infra{background:rgba(217,119,6,.35);color:#fcd34d;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(251,191,36,.5)}
.popup-chornobyl{background:rgba(168,85,247,.35);color:#e9d5ff;padding:3px 6px;border-radius:5px;font-weight:700;font-size:.68rem;display:inline-block;margin-top:4px;border:1px solid rgba(216,180,254,.5)}
.popup-trail{margin-top:6px;padding:6px 8px;border-radius:5px;background:rgba(148,163,184,.12);border:1px dashed rgba(148,163,184,.5);font-size:.68rem;line-height:1.45;color:#cbd5e1;max-height:150px;overflow-y:auto}
.popup-trail .pt-title{font-weight:700;color:#e2e8f0;margin-bottom:3px}
.popup-trail .pt-point{display:flex;gap:5px;align-items:flex-start;margin:1px 0}
.popup-trail .pt-num{flex-shrink:0;font-family:ui-monospace;color:#94a3b8;min-width:14px}
.popup-trail .pt-place{flex:1;color:#e2e8f0}
.popup-trail .pt-time{color:#94a3b8;font-size:.6rem;margin-left:3px}
.popup-trail .pt-arrow{color:#fbbf24;font-weight:800}
.threat-wrap{position:relative}
.threat-rotate{position:absolute;inset:0;transform-origin:center center;will-change:transform;display:flex;align-items:center;justify-content:center}
.threat-icon{display:flex;align-items:center;justify-content:center;transform-origin:center center;position:relative;animation:pulse 1.8s ease-in-out infinite;line-height:0}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px rgba(0,0,0,.5));opacity:1}50%{filter:drop-shadow(0 0 8px rgba(251,191,36,.55));opacity:.92}}
.threat-icon.confirm-2{filter:drop-shadow(0 0 7px rgba(34,197,94,.9))}
.threat-icon.confirm-3{filter:drop-shadow(0 0 10px rgba(250,204,21,.95));animation:cPulse 1.3s ease-in-out infinite}
.threat-icon.confirm-5{filter:drop-shadow(0 0 14px rgba(250,204,21,1));animation:cPulse 1s ease-in-out infinite}
@keyframes cPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.threat-icon.falling{animation:fallingBlink .55s ease-in-out infinite}
@keyframes fallingBlink{0%,100%{filter:drop-shadow(0 0 2px rgba(220,38,38,.9));opacity:1}50%{filter:drop-shadow(0 0 12px rgba(220,38,38,1));opacity:.35}}
.threat-icon.stale{opacity:.55;filter:grayscale(.4)}
.threat-icon.threat-pulse{animation:threatPulse 1s ease-in-out infinite}
@keyframes threatPulse{0%,100%{filter:drop-shadow(0 0 3px rgba(220,38,38,.9));opacity:1}50%{filter:drop-shadow(0 0 12px rgba(220,38,38,1));opacity:.55}}
.threat-icon.ballistic-alarm{animation:ballisticAlarmPulse .5s ease-in-out infinite}
@keyframes ballisticAlarmPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(220,38,38,1))}50%{transform:scale(1.2);filter:drop-shadow(0 0 16px rgba(220,38,38,1));opacity:.75}}
.threat-icon.priority-star::after{content:"⭐";position:absolute;top:-10px;left:-6px;font-size:11px;filter:drop-shadow(0 0 3px rgba(251,191,36,1))}
.threat-icon.arrived-pulse{animation:arrivedPulse .7s ease-in-out infinite}
@keyframes arrivedPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px rgba(220,38,38,1))}50%{transform:scale(1.25);filter:drop-shadow(0 0 18px rgba(220,38,38,1));opacity:.55}}
.strat-wrap{position:relative}
.strat-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 6px rgba(0,0,0,.6))}
.strat-icon.training{animation:stratTrain 2.5s ease-in-out infinite}
.strat-icon.active{animation:stratActive 1.2s ease-in-out infinite}

<script>
"use strict";

/* ============ 1. LOG ============ */
const RadarLog = (() => {
  const buf = []; const MAX = 200;
  function push(scope, msg, err) {
    const rec = { t: Date.now(), scope, msg: String(msg), stack: err && err.stack ? String(err.stack).slice(0, 400) : null };
    buf.push(rec); if (buf.length > MAX) buf.shift();
    console.warn(`[radar:${scope}]`, msg, err || "");
  }
  function showBanner(m) {
    try { const b = document.getElementById("errBanner"), t = document.getElementById("errText");
      if (b && t) { t.textContent = String(m || "?"); b.classList.add("show"); } } catch (e) {}
  }
  return { push, showBanner, all: () => buf.slice() };
})();
window.addEventListener("error", e => RadarLog.showBanner(e.message));
window.addEventListener("unhandledrejection", e => { try { RadarLog.showBanner(e.reason?.message || String(e.reason)); } catch (x) {} });

/* ============ 2. UTILS ============ */
const $ = id => document.getElementById(id);
const esc = s => (s == null ? "" : String(s)).replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const norm = s => (s || "").toLowerCase().replace(/[’`´']/g, "'").replace(/[^\p{L}\p{N}\s'-]/gu, " ").replace(/\s+/g, " ").trim();

function haversineKm(a, b, c, d) {
  const R = 6371, toR = x => x * Math.PI / 180;
  const dLat = toR(c - a), dLon = toR(d - b);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a)) * Math.cos(toR(c)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearingBetween(lat1, lon1, lat2, lon2) {
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function destPoint(lat, lon, brg, distKm) {
  const R = 6371, br = brg * Math.PI / 180, lat1 = lat * Math.PI / 180, lon1 = lon * Math.PI / 180;
  const lat2 = Math.asin(Math.sin(lat1) * Math.cos(distKm / R) + Math.cos(lat1) * Math.sin(distKm / R) * Math.cos(br));
  const lon2 = lon1 + Math.atan2(Math.sin(br) * Math.sin(distKm / R) * Math.cos(lat1), Math.cos(distKm / R) - Math.sin(lat1) * Math.sin(lat2));
  return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];
}
function kyivHoldPoint() {
  const brg = CONFIG.KYIV_HOLD_BEARING, km = CONFIG.KYIV_HOLD_KM;
  const [la, lo] = destPoint(CONFIG.KYIV[0], CONFIG.KYIV[1], brg, km);
  return { lat: la, lon: lo };
}
function headingTowardKyiv(lat, lon) { return bearingBetween(lat, lon, CONFIG.KYIV[0], CONFIG.KYIV[1]); }
function distToKyiv(lat, lon) { return haversineKm(lat, lon, CONFIG.KYIV[0], CONFIG.KYIV[1]); }
function isKyivTarget(place, targetPlace) {
  const names = [place?.name, place?.key, targetPlace?.name, targetPlace?.key].filter(Boolean).join(" ").toLowerCase();
  if (/ки[їе]в|kyiv|kiev/.test(names)) return true;
  if (place && place.lat != null && distToKyiv(place.lat, place.lon != null ? place.lon : place.lng) < 3) return true;
  if (targetPlace && targetPlace.lat != null && distToKyiv(targetPlace.lat, targetPlace.lon) < 3) return true;
  return false;
}
function compassName(deg) {
  if (deg == null || !Number.isFinite(deg)) return "—";
  const dirs = ["Пн","ПнСх","Сх","ПдСх","Пд","ПдЗх","Зх","ПнЗх"];
  return dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
}
function userRelationTo(lat, lon) {
  try {
    if (lat == null || lon == null) return null;
    const u = (typeof GeoLoc !== "undefined" && GeoLoc.getLast) ? GeoLoc.getLast() : null;
    if (!u) return null;
    const km = haversineKm(u.lat, u.lon, lat, lon);
    const bearing = bearingBetween(u.lat, u.lon, lat, lon);
    return { km, bearing, compass: compassName(bearing) };
  } catch (e) { return null; }
}
function userRelHtml(lat, lon) {
  if (lat == null || lon == null) return "";
  const rel = userRelationTo(lat, lon);
  const attrs = `data-ulat="${lat}" data-ulon="${lon}"`;
  if (!rel) return `<div class="popup-user-rel" ${attrs} style="opacity:.55">🧭 —</div>`;
  const km = rel.km < 1 ? `${Math.round(rel.km * 1000)} м` : `${rel.km.toFixed(1)} км`;
  const prox = rel.km < 5 ? ' <span class="rel-close">⚠ БЛИЗЬКО</span>' : "";
  return `<div class="popup-user-rel" ${attrs}><span class="rel-arrow">🧭</span>Від вас: <b>${km}</b> · ${rel.compass} (${Math.round(rel.bearing)}°)${prox}</div>`;
}
function refreshUserRels() {
  document.querySelectorAll(".popup-user-rel[data-ulat]").forEach(el => {
    const lat = parseFloat(el.dataset.ulat), lon = parseFloat(el.dataset.ulon);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    const rel = userRelationTo(lat, lon);
    if (!rel) { el.style.opacity = ".55"; el.innerHTML = "🧭 —"; return; }
    el.style.opacity = "1";
    const km = rel.km < 1 ? `${Math.round(rel.km * 1000)} м` : `${rel.km.toFixed(1)} км`;
    const prox = rel.km < 5 ? ' <span class="rel-close">⚠ БЛИЗЬКО</span>' : "";

  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

    for (let i = 0; i < n; i++) setTimeout(() => playSirenOnce(dur), i * (dur + 250));

    const now = Date.now();

    triggerSirenSequence(3000, 3);
    Alerts.showTopAlert({ kind: "ballistic", icon: "🚨", title: t("alert.ballistic.title"), place: t("alert.ballistic.place"), meta: t("alert.ballistic.meta") });

  }
  function isRocketType(ty) { return ROCKET_TYPES.has(ty); }

  function fireSirenForTarget(key, clsLike, ch) {

})();

/* ============ 12.5 ALERT COUNTER ============ */
const AlertCounter = (() => {
  const KEY = "kyiv_alert_counter_v1";
  let state = { date: "", count: 0, active: false };
  function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function load() {
    try { const raw = localStorage.getItem(KEY); const s = raw ? JSON.parse(raw) : null;
      if (s && s.date === today() && typeof s.count === "number") state = { date: s.date, count: s.count | 0, active: !!s.active };
      else state = { date: today(), count: 0, active: false };
    } catch (e) { state = { date: today(), count: 0, active: false }; }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function rollover() { if (state.date !== today()) { state = { date: today(), count: 0, active: false }; save(); } }
  function update(isActiveNow) {
    rollover();
    const now = !!isActiveNow;
    if (now && !state.active) { state.active = true; state.count += 1; save(); }
    else if (!now && state.active) { state.active = false; save(); }
  }
  function getCount() { rollover(); return state.count; }
  function isActive() { rollover(); return state.active; }
  load();
  return { update, getCount, isActive };
})();

/* ============ 12.6 BALLISTIC COUNTDOWN ============ */
const BallisticTimer = (() => {
  const BALLISTIC_RE = /балістік|баллистик|кинжал|кінжал|іскандер|искандер|кн[\s\-–]?23|kn[\s\-–]?23|циркон|zircon|3м22|3m22|онікс|оникс|oniks|p[\s\-–]?800|с[\s\-–]?300|с[\s\-–]?400|орешник|орєшнік|oreshnik/i;
  let startedAt = 0, tickTimer = null;
  function render() {
    const el = $("ballisticTimer"); if (!el) return;
    const left = startedAt ? Math.max(0, CONFIG.BALLISTIC_COUNTDOWN_MS - (Date.now() - startedAt)) : 0;
    if (!startedAt || left <= 0) { el.classList.remove("show"); el.textContent = ""; return; }
    const secs = Math.ceil(left / 1000);
    el.textContent = "🚨 " + secs + "s";
    el.classList.add("show");
    if (secs <= 20) { el.style.background = "#7f1d1d"; el.style.borderColor = "#fecaca"; }
    else if (secs <= 60) { el.style.background = "#b91c1c"; el.style.borderColor = "#fca5a5"; }
    else { el.style.background = "#7c2d12"; el.style.borderColor = "#fca5a5"; }
  }
  function ensureTicker() {
    if (tickTimer) return;
    tickTimer = setInterval(() => {
      const left = startedAt ? (Date.now() - startedAt) : Infinity;
      if (!startedAt || left >= CONFIG.BALLISTIC_COUNTDOWN_MS) { clearInterval(tickTimer); tickTimer = null; startedAt = 0; render(); return; }
      render();
    }, 200);
  }
  function start(fromMs) {
    startedAt = fromMs || Date.now();
    if (Date.now() - startedAt >= CONFIG.BALLISTIC_COUNTDOWN_MS) { startedAt = 0; render(); return; }
    ensureTicker(); render();
  }
  function isActive() { return !!startedAt && (Date.now() - startedAt) < CONFIG.BALLISTIC_COUNTDOWN_MS; }
  function check(text, msgMs) {
    if (!text || !BALLISTIC_RE.test(text)) return false;
    const now = Date.now();
    let ts = msgMs && Number.isFinite(msgMs) ? msgMs : now;
    if (ts > now) ts = now;
    if (now - ts > CONFIG.BALLISTIC_MSG_MAX_AGE_MS) return false;
    if (isActive()) return true;
    start(ts); return true;
  }
  function stop() { startedAt = 0; render(); }
  return { check, start, stop, isActive };
})();

/* ============ 13. ALERTS ============ */
const Alerts = (() => {
  const seen = new Map();
  const DISMISS_KEY = "kyiv_radar_dismissed_alerts_v1";
  let timer = null, lastKind = null;
  function loadDismissed() { try { return new Set(JSON.parse(localStorage.getItem(DISMISS_KEY) || "[]")); } catch (e) { return new Set(); } }
  function saveDismissed(key) { try { const s = loadDismissed(); s.add(key); localStorage.setItem(DISMISS_KEY, JSON.stringify([...s].slice(-60))); } catch (e) {} }
  function contentKey(kind, place, meta, rawText) { return (kind || "") + "|" + (place || "") + "|" + ((rawText || meta || "").replace(/\s+/g, " ").slice(0, 80).toLowerCase()); }
  function isSummary(text) {
    if (!text) return false;
    return /(?:протягом\s+(?:минулої|останньої|цієї)\s+доби|за\s+(?:минулу|останню)\s+добу|внаслідок\s+обстріл|за\s+даними\s+(?:ова|хова|сова)|зведення\s+за\s+добу|підсумки\s+(?:доби|дня)|за\s+добу\s+ворог|станом\s+на\s+\d|офіційне\s+зведення)/i.test(text);
  }
  function showTopAlert({kind, icon, title, place, meta, rawText}) {
    const el = $("topAlert"); if (!el) return;
    if (lastKind === "ballistic" && kind !== "ballistic") { if (timer) return; }
    if (isSummary(rawText) || isSummary(meta)) return;
    const key = contentKey(kind, place, meta, rawText);
    if (loadDismissed().has(key)) return;
    const now = Date.now();
    const prev = seen.get(key);
    if (prev && (now - prev) < 15 * 60 * 1000) return;
    seen.set(key, now);
    lastKind = kind;
    el.dataset.alertKey = key;
    el.className = "top-alert show " + kind;
    const iconEl = $("topAlertIcon"), titleEl = $("topAlertTitle"), placeEl = $("topAlertPlace"), metaEl = $("topAlertMeta");
    if (iconEl) iconEl.textContent = icon || "🚨";
    if (titleEl) titleEl.textContent = title || "—";
    if (place) { if (placeEl) { placeEl.textContent = place; placeEl.style.display = "block"; } } else if (placeEl) placeEl.style.display = "none";
    if (meta) { if (metaEl) { metaEl.textContent = meta; metaEl.style.display = "block"; } } else if (metaEl) metaEl.style.display = "none";
    if (timer) clearTimeout(timer);
    timer = setTimeout(() => hideTopAlert(), kind === "ballistic" ? CONFIG.TOP_ALERT_BALLISTIC_TTL_MS : Math.min(CONFIG.TOP_ALERT_TTL_MS, 20000));
  }
  function hideTopAlert(permanent) {
    const el = $("topAlert");
    if (el) { if (permanent && el.dataset.alertKey) saveDismissed(el.dataset.alertKey); el.classList.remove("show"); el.dataset.alertKey = ""; }
    lastKind = null;
    if (timer) { clearTimeout(timer); timer = null; }
  }
  function showImpact(report, place, text) {
    if (isSummary(text)) return;
    const kind = report.kind;
    let icon = report.icon, title = "";
    if (kind === "hit") { title = t("alert.impact.title"); icon = "💥"; }
    else if (kind === "down") { title = /(?:уламк|обломк)/i.test(text||"") ? t("alert.debris.title") : t("alert.falling.title"); icon = "🛬"; }
    else if (kind === "shot") { title = t("alert.shot.title"); icon = "🛡️"; }
    else if (kind === "fire") { title = t("alert.fire.title"); icon = "🔥"; }
    else return;
    const placeLine = place && place.name ? place.name : "";
    const meta = (text || "").replace(/\s+/g, " ").slice(0, 140);
    const alertKind = kind === "down" ? "falling" : (kind === "shot" ? "shot" : (kind === "fire" ? "fire" : "impact"));
    showTopAlert({ kind: alertKind, icon, title, place: placeLine, meta, rawText: text || "" });
  }
  return { showTopAlert, hideTopAlert, showImpact, isSummary };
})();

/* ============ 17. AI ============ */
const AI = (() => {
  const W = {channel:.30, confirmations:.25, freshness:.15, hasCoords:.10, hardClassifier:.10, hasTarget:.10};
  const LEVELS = {critical:.75, high:.55, medium:.35};

    text = (text || "").trim();
    if (!text || text.length < 8) return {ok:false};
    return {ok:true};
  }
  function score(ctx) {
    const now = Date.now();
    const ageMin = Math.max(0, (now - (ctx.firstSeen || now)) / 60000);
    const channels = uniqueChannels(ctx.channels instanceof Set ? ctx.channels : (ctx.channels || []));
    const chScore = Math.min(totalWeightOf(channels) / channels.size / 2, 1);
    const confScore = Math.min(channels.size / 4, 1);
    const freshScore = Math.max(0, 1 - ageMin / 30);
    const geoScore = (ctx.place && ctx.place.lat != null) ? 1 : .3;
    const hardScore = (ctx.cls && ctx.cls.hard) ? 1 : .4;
    const targetScore = ctx.target ? 1 : .2;
    const total = W.channel * chScore + W.confirmations * confScore + W.freshness * freshScore + W.hasCoords * geoScore + W.hardClassifier * hardScore + W.hasTarget * targetScore;
    let level = "low";
    if (total >= LEVELS.critical) level = "critical";
    else if (total >= LEVELS.high) level = "high";
    else if (total >= LEVELS.medium) level = "medium";
    return { total: Math.round(total * 100) / 100, level };
  }
  const META = { critical:{color:"#fecaca",bg:"rgba(220,38,38,.35)",border:"#dc2626",label:"CRITICAL"}, high:{color:"#fed7aa",bg:"rgba(234,88,12,.3)",border:"#ea580c",label:"HIGH"}, medium:{color:"#fef08a",bg:"rgba(202,138,4,.3)",border:"#ca8a04",label:"MEDIUM"}, low:{color:"#cbd5e1",bg:"rgba(148,163,184,.2)",border:"#94a3b8",label:"LOW"} };
  function badgeHtml(r) {
    if (!r) return "";
    const m = META[r.level] || META.low;
    return `<div class="ai-badge" style="background:${m.bg};color:${m.color};border-color:${m.border}">🤖 ${m.label} · ${Math.round(r.total * 100)}%</div>`;
  }
  return { score, moderate, badgeHtml };
})();

        }

/* ============ 22. FEED ============ */
const Feed = (() => {
  let timer = null;
  function schedule() { if (timer) return; timer = setTimeout(() => { timer = null; render(); }, 300); }
  function iconFor(item) {
    const ty = item.cls?.type || item.threat?.type || "";
    if (item.kind === "warning") return "⚠️";
    if (item.kind === "mass") return "📡";
    if (item.kind === "impact" || ty === "impact") return "💥";
    if (item.kind === "strategic") return "✈️";
    if (ty === "zircon" || ty === "ballistic") return "🚨";
    if (ty === "jet_drone") return "⚡";
    if (["geran2","geran3","geran4","geran5","uav","fpv"].includes(ty)) return "🛸";
    if (["missile","kab","banderol","umpb"].includes(ty)) return "🚀";
    if (ty === "recon") return "👁";
    return "📍";
  }
  function colorFor(item) {
    const ty = item.cls?.type || item.threat?.type || "";
    if (item.kind === "warning") return "#fbbf24";
    if (item.kind === "mass") return "#a78bfa";
    if (item.kind === "strategic") return "#facc15";
    if (item.kind === "impact" || ty === "impact") return "#ff7c3b";
    if (ty === "zircon" || ty === "ballistic") return "#d94a8c";
    if (["jet_drone","geran2","geran3","geran4","geran5"].includes(ty)) return "#dc2626";
    if (["missile","kab","banderol","umpb"].includes(ty)) return "#e55757";
    if (ty === "recon") return "#3b82f6";
    if (["uav","fpv"].includes(ty)) return "#FFD700";
    return "#4ca9e8";
  }
  function collect() {
    const out = [];
    for (const tr of State.tracks.values()) {
      if (tr.threat.areaOnly || tr.threat.advisory) continue;
      const ll = tr.marker?.getLatLng();
      if (!ll) continue;
      out.push({ kind: "api", id: "api:" + tr.threat.id, cls: {type:tr.threat.type,label:tr.threat._exactName || typeLabel(tr.threat)}, threat: tr.threat, name: tr.threat.locality || tr.threat.region || "—", lat: ll.lat, lng: ll.lng, eta: tr.eta, dist: haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], ll.lat, ll.lng), ts: tr.baseTime || Date.now(), marker: tr.marker, hasPriority: false, speed: tr.threat._speed || null, droneId: tr.threat._droneId || null });
    }
    for (const o of State.msgMarkers.values()) {
      if (!o.marker || o.isRegion) continue;
      const ll = o.marker.getLatLng();
      if (!ll) continue;
      out.push({ kind: "msg", id: o.id, cls: {type:o.cls.type,label:o.exactName || o.cls.label}, name: o.place?.name || o.targetPlace?.name || "—", lat: ll.lat, lng: ll.lng, eta: o.eta, dist: haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], ll.lat, ll.lng), ts: o.lastSeen || Date.now(), confirmN: o.confirmN, marker: o.marker, hasPriority: !!o.hasPriority, speed: o.speedKmh || null, droneId: o.droneId || null });
    }
    for (const it of State.strategicActivity.values()) {
      if (!it.typeMeta) continue;
      const lat = it.airport ? it.airport.lat : it.lat, lon = it.airport ? it.airport.lon : it.lon;
      if (lat == null) continue;
      const eta = Strategic.etaToKyiv(lat, lon, it.typeMeta.speedKmh);
      out.push({ kind: "strategic", id: "strat:" + it.key, cls: {type:"strategic",label:it.typeMeta.label + (it.count > 1 ? " ×" + it.count : "")}, name: (it.airport ? it.airport.name : (it.name || "—")), lat, lng: lon, dist: eta.distKm, eta: eta.etaMin, ts: it.lastSeen || Date.now(), hasPriority: hasPrioritySource(it.channels) });
    }
    for (const r of State.impactReports.values()) {
      out.push({ kind: "impact", id: "impact:" + r.report.kind + ":" + r.name, cls: {type:"impact",label:r.report.label}, name: r.name, lat: r.lat, lng: r.lon, ts: r.lastSeen || Date.now(), dist: haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], r.lat, r.lon), marker: r.marker, hasPriority: hasPrioritySource(r.channels) });
    }
    if (Mass.isActive()) out.push({ kind: "mass", id: "mass:banner", cls: {type:"mass",label:"МАСОВАНА АКТИВНІСТЬ"}, name: Mass.getTitle(), lat: null, lng: null, ts: Date.now(), hasPriority: true });
    out.sort((a, b) => a.hasPriority !== b.hasPriority ? (a.hasPriority ? -1 : 1) : b.ts - a.ts);
    return out;
  }
  function render() {
    const cont = $("events"); if (!cont) return;
    const items = collect();
    const cnt = $("eventCount"); if (cnt) cnt.textContent = items.length + (currentLang === "en" ? " events" : " подій");
    if (!items.length) { cont.innerHTML = `<div class="panel-empty">${t("panel.empty")}</div>`; return; }
    cont.innerHTML = items.slice(0, 60).map((it, idx) => {
      const color = colorFor(it), icon = iconFor(it);
      const label = it.cls?.label || it.threat?.type || "";
      const time = new Date(it.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      let tags = "";
      if (it.hasPriority) tags += `<span class="tag prio">⭐</span>`;
      if (it.kind === "strategic") tags += `<span class="tag strategic">${t("feed.strategic")}</span>`;
      if (it.kind === "mass") tags += `<span class="tag mass">${t("feed.mass")}</span>`;
      if (it.droneId) tags += `<span class="tag drone-id">🏷 ${esc(it.droneId)}</span>`;
      if (it.confirmN != null) tags += `<span class="tag">${it.confirmN}✓</span>`;

      if (it.eta != null) tags += `<span class="tag">⏱ ${formatEta(it.eta)}</span>`;
      return `<div class="event" data-feed-idx="${idx}" style="border-left-color:${color}"><div class="event-top"><div class="event-type" style="color:${color}">${it.hasPriority ? '<span class="event-prio">⭐</span>' : ''}<span class="event-icon">${icon}</span>${esc(label)}</div><div class="event-time">${time}</div></div><div class="event-loc">📍 ${esc(it.name || "—")}</div>${tags ? `<div class="event-meta">${tags}</div>` : ''}</div>`;
    }).join("");
    cont.querySelectorAll(".event").forEach(el => {
      el.addEventListener("click", () => {
        const it = items[+el.getAttribute("data-feed-idx")];
        if (it && it.lat != null && map) map.setView([it.lat, it.lng], it.kind === "strategic" ? 7 : 12, { animate: true });

})();

/* ============ 26. NET ============ */
const Net = (() => {
  let ws = null, wsConnected = false, wsReconnectMs = CONFIG.WS_RECONNECT_MS, wsReconnectTimer = null;
  let restFallbackActive = false, pollTimer = null, abortCtrl = null;
  function scheduleReconnect() {
    if (wsReconnectTimer) return;
    wsReconnectTimer = setTimeout(() => { wsReconnectTimer = null; connect(); }, wsReconnectMs);
    wsReconnectMs = Math.min(wsReconnectMs * 2, CONFIG.WS_RECONNECT_MAX_MS);
  }
  function connect() {
    try {
      if (ws) { try { ws.close(); } catch (e) {} ws = null; }
      ws = new WebSocket(CONFIG.WS_URL);
      ws.onopen = () => {
        wsConnected = true; wsReconnectMs = CONFIG.WS_RECONNECT_MS; restFallbackActive = false;
        updateBadge("ok");
        fetchThreatsAndAlerts().catch(() => {});
        fetchMessages().catch(() => {});
        startPolling(true);
      };
      ws.onmessage = e => { try { handleFrame(JSON.parse(e.data)); } catch (err) { RadarLog.push("ws.message", err.message, err); } };
      ws.onerror = () => {};
      ws.onclose = () => {
        wsConnected = false; ws = null; updateBadge("err");
        if (!restFallbackActive) { restFallbackActive = true; startPolling(); }
        scheduleReconnect();
      };
    } catch (e) {
      if (!restFallbackActive) { restFallbackActive = true; startPolling(); }
      scheduleReconnect();
    }
  }
  const wsState = { threats: new Map() };
  function handleFrame(env) {
    if (!env || !env.type) return;
    if (env.type === "snapshot") {
      const data = env.data || {};
      const list = data.threats || [];
      if (list.length) { wsState.threats.clear(); for (const tx of list) if (tx.id) wsState.threats.set(tx.id, tx); syncThreats([...wsState.threats.values()]); }
      if (data.alerts) try { syncAlertPolygons(data.alerts); } catch (e) {}

    const b = $("btnVisual"); if (!b) return;
    b.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation(); Audio.unlock();
      const allOn = Object.values(VIS_FLAGS).every(v => v);
      for (const k of Object.keys(VIS_FLAGS)) VIS_FLAGS[k] = !allOn;
      saveVisFlags();
      document.body.classList.toggle("card-on", VIS_FLAGS.card);
      const card = $("bottomCard"); if (card) card.classList.toggle("show", VIS_FLAGS.card);
      b.classList.toggle("on", !allOn);
      refreshAllVisuals();
      showToast(allOn ? "👁 Візуалізація OFF" : "👁 Візуалізація ON");
    });
  })();
  (function geoBtn() {
    const b = $("btnGeo"); if (!b || !map) return;
    let longTimer = null, fired = false;
    function startLong() { fired = false; longTimer = setTimeout(() => { fired = true; longTimer = null; if (GeoLoc.isEnabled()) GeoLoc.center(); }, 600); }
    function endLong() { if (longTimer) { clearTimeout(longTimer); longTimer = null; } }
    b.addEventListener("touchstart", startLong, { passive: true });
    b.addEventListener("touchend", endLong);
    b.addEventListener("mousedown", startLong);
    b.addEventListener("mouseup", endLong);
    b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); if (fired) { fired = false; return; } Audio.unlock(); GeoLoc.toggle(); });
  })();
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { Net.stopPolling(); stopAnim(); }
    else { if (!Net.isConnected()) Net.startPolling(); startAnim(); Audio.unlock(); }
  });
  document.addEventListener("click", e => {
    const btn = e.target.closest(".popup-remove-btn");
    if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    const kind = btn.getAttribute("data-remove-kind"), key = btn.getAttribute("data-remove-key");
    if (kind && key) { removeMarkerByKey(kind, key); try { map.closePopup(); } catch (_) {} }
  });
  document.addEventListener("click", e => {
    const btn = e.target.closest(".popup-toggle-btn");
    if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    const key = btn.getAttribute("data-toggle-trail");
    if (key) { toggleTrailLine(key); const chain = State.trails.get(key); if (chain) btn.textContent = "📌 " + (chain.polyline ? t("popup.toggleTrailHide") : t("popup.toggleTrail")); }
  });
}

/* ============ 30. SEARCH ============ */
function initSearch() {
  const input = $("searchInput"), btn = $("searchBtn"), results = $("searchResults");
  if (!input || !btn || !results || !map) return;
  let searchMarker = null, debounceTimer = null;
  function hideResults() { results.classList.remove("show"); results.innerHTML = ""; }
  function showResults(items) {
    if (!items.length) { hideResults(); return; }
    results.innerHTML = items.map((it, i) => `<div class="search-item" data-idx="${i}"><div class="name">${esc(it.name)}</div><div class="addr">${esc(it.addr || "")}</div></div>`).join("");
    results.classList.add("show");
    results.querySelectorAll(".search-item").forEach(el => {
      el.addEventListener("click", () => {
        const it = items[+el.dataset.idx];
        if (!it) return;
        map.setView([it.lat, it.lon], 14, { animate: true });
        if (searchMarker) map.removeLayer(searchMarker);
        searchMarker = L.marker([it.lat, it.lon], { icon: L.divIcon({ className: "", html: '<div style="background:#3b82f6;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px #3b82f6"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(map);
        searchMarker.bindPopup(`<div><b>${esc(it.name)}</b><br><button type="button" id="searchMarkerRemove" style="margin-top:8px;width:100%;height:28px;border-radius:6px;background:#dc2626;color:#fff;border:0;cursor:pointer">🗑 Видалити</button></div>`).openPopup();
        searchMarker.on("popupopen", () => { const bb = document.getElementById("searchMarkerRemove"); if (bb) bb.onclick = () => { if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; } }; });
        hideResults(); input.blur();
      });
    });
  }
  async function doSearch(q) {
    q = (q || "").trim();
    if (q.length < 2) { hideResults(); return; }
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=8&countrycodes=ua,by,pl,md,ro&accept-language=uk,en&addressdetails=1`;
      const data = await (await fetch(url, { headers: { "Accept-Language": "uk,en" } })).json();
      showResults((data || []).map(d => ({ name: d.display_name.split(",")[0] || "?", addr: d.display_name, lat: +d.lat, lon: +d.lon })).filter(x => Number.isFinite(x.lat) && Number.isFinite(x.lon)));
    } catch (e) { showToast("Помилка пошуку"); hideResults(); }
  }
  btn.addEventListener("click", e => { e.preventDefault(); doSearch(input.value); });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); doSearch(input.value); }
    if (e.key === "Escape") { hideResults(); input.value = ""; input.blur(); }
  });
  input.addEventListener("input", () => { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => doSearch(input.value), 400); });
  document.addEventListener("click", e => { if (!results.contains(e.target) && e.target !== input && e.target !== btn) hideResults(); });
}

/* ============ 31. USER MARKERS ============ */
function initUserMarkers() {
  const MARKERS_KEY = "kyiv_radar_user_markers_v1";
  let addMode = false, userMarkers = [], markerLayer = null;
  const btn = $("btnMarkers");
  if (!btn || !map) return;
  function load() { try { const raw = localStorage.getItem(MARKERS_KEY); userMarkers = raw ? JSON.parse(raw) : []; if (!Array.isArray(userMarkers)) userMarkers = []; } catch (e) { userMarkers = []; } }
  function save() { try { localStorage.setItem(MARKERS_KEY, JSON.stringify(userMarkers)); } catch (e) {} }
  function makeIcon() { return L.divIcon({ className: "", html: '<div style="background:#ea580c;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>', iconSize: [18, 18], iconAnchor: [9, 18] }); }
  function render() {
    if (markerLayer) markerLayer.clearLayers();
    else markerLayer = L.layerGroup().addTo(map);
    userMarkers.forEach(m => {
      const marker = L.marker([m.lat, m.lng], { icon: makeIcon(), draggable: true }).addTo(markerLayer);
      marker.bindPopup(`<div><b>${esc(m.title || "Мітка")}</b><br><textarea style="width:100%;margin-top:6px" placeholder="Нотатка">${esc(m.note || "")}</textarea><br><button type="button" class="pm-save">💾</button> <button type="button" class="pm-del">🗑</button></div>`);
      marker.on("dragend", () => { const ll = marker.getLatLng(); m.lat = ll.lat; m.lng = ll.lng; save(); });
      marker.on("popupopen", () => {
        document.querySelector(".pm-save")?.addEventListener("click", () => save());
        document.querySelector(".pm-del")?.addEventListener("click", () => { markerLayer.removeLayer(marker); userMarkers = userMarkers.filter(x => x.id !== m.id); save(); });
      });
      m._leaflet = marker;
    });
  }
  function addAt(lat, lng) {
    const m = { id: Date.now() + "_" + Math.random().toString(36).slice(2, 7), lat, lng, title: "Мітка", note: "" };
    userMarkers.push(m); save(); render();
    showToast("Мітку додано");
  }
  function setAddMode(on) {
    addMode = !!on;
    btn.classList.toggle("on", addMode);
    map.getContainer().style.cursor = addMode ? "crosshair" : "";
    showToast(addMode ? "Клікніть на карту" : "Режим вимкнено");
  }
  btn.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); Audio.unlock(); setAddMode(!addMode); });
  map.on("click", e => { if (addMode) addAt(e.latlng.lat, e.latlng.lng); });
  load(); render();
}

/* ============ 32. FULLSCREEN ============ */
function initFullscreen() {
  const btn = $("btnFullscreen"); if (!btn) return;
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function update() { btn.classList.toggle("on", isFs()); }
  btn.addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation(); Audio.unlock();
    try {
      if (isFs()) document.exitFullscreen?.();
      else document.documentElement.requestFullscreen?.().catch(() => showToast("Fullscreen заблоковано"));
    } catch (err) { showToast("Fullscreen недоступний"); }
    setTimeout(update, 300);
  });
  document.addEventListener("fullscreenchange", update);
  update();
}

/* ============ 33. NOTIFICATIONS ============ */
function initNotifications() {
  const NOTIF_DIST_KM = 30, notified = new Set();
  let permissionAsked = false;
  async function ensurePermission() {
    if (!("Notification" in window) || Notification.permission === "denied") return false;
    if (Notification.permission === "granted") return true;
    if (permissionAsked) return false;
    permissionAsked = true;
    try { return (await Notification.requestPermission()) === "granted"; } catch (e) { return false; }
  }
  window.notifyThreatNearKyiv = async function(item) {
    if (!item) return;
    const lat = item.lat ?? item.place?.lat, lon = item.lng ?? item.lon ?? item.place?.lon;
    if (lat == null || lon == null) return;
    const d = haversineKm(CONFIG.KYIV[0], CONFIG.KYIV[1], lat, lon);
    if (d > NOTIF_DIST_KM) return;
    const key = (item.id || item.name || "") + ":" + Math.round(lat * 100) + ":" + Math.round(lon * 100);
    if (notified.has(key)) return;
    notified.add(key);
    if (!(await ensurePermission())) return;
    try {
      const n = new Notification(`⚠ ${item.cls?.label || "Загроза"} · ${Math.round(d)} км`, { body: item.name || "—", tag: key });
      n.onclick = () => { window.focus(); if (lat != null && map) map.setView([lat, lon], 12); n.close(); };
    } catch (e) {}
  };
  document.addEventListener("click", () => ensurePermission(), { once: true });
}

/* ============ 34. THEME ============ */
function initTheme() {
  document.documentElement.setAttribute("data-theme", "military");
}

/* ============ 35. INIT ============ */
function loadSettings() {
  try { if (localStorage.getItem("kyiv_rings_v41") === "1") ringsVisible = true; } catch (e) {}
  try { if (localStorage.getItem("kyiv_settlements_v41") === "1") settlementsVisible = true; } catch (e) {}
  try { if (localStorage.getItem("kyiv_strategic_v41") === "1") strategicVisible = true; } catch (e) {}
  try { const v = localStorage.getItem("kyiv_infra_mode_v41"); if (v != null) { const i = +v; if (i >= 0 && i <= 4) infraMode = i; } } catch (e) {}
  try { if (localStorage.getItem("kyiv_power_vis_v1") === "1") powerVisible = true; } catch (e) {}
  try { const cb = localStorage.getItem("kyiv_base_map"); if (cb === "osm" || cb === "sat") currentBase = cb; } catch (e) {}
}
async function init() {
  try {
    setStatus("warn", t("status.loading"));
    loadSettings();
    initMap();
    if (currentBase === "osm" && baseSat && map.hasLayer(baseSat)) {
      map.removeLayer(baseSat);
      if (!osmLayer) osmLayer = L.tileLayer(CONFIG.TILE_URL, { maxZoom: 19, attribution: CONFIG.TILE_ATTR });
      osmLayer.addTo(map);
    }
    initTheme();
    initUI();
    initSearch();
    initUserMarkers();
    initFullscreen();
    initNotifications();
    applyScopeMode(false);
    Net.connect();
    Net.fetchMessages();
    setInterval(Net.fetchMessages, 5000);
    startAnim();
    Feed.render();
    setInterval(Feed.render, 8000);
    setTimeout(() => Audio.unlock(), 500);
    updateSettlementsVisibility();
    if (strategicVisible && strategicLayer && map && !map.hasLayer(strategicLayer)) strategicLayer.addTo(map);
    const b = $("btnInfra");
    if (b) {
      b.classList.remove("on", "infrastructure", "energy", "incidents");
      if (infraMode === 1) b.classList.add("infrastructure");
      else if (infraMode === 2) b.classList.add("energy");
      else if (infraMode === 3) b.classList.add("incidents");
      else if (infraMode === 4) b.classList.add("on");
    }
    if (infraMode > 0) rebuildInfraLayer();
    if (powerVisible) rebuildPowerLayer();
    applyLang();
    document.body.classList.toggle("card-on", VIS_FLAGS.card);
    const bc = $("bottomCard"); if (bc) bc.classList.toggle("show", VIS_FLAGS.card);
    refreshAllVisuals();
    setInterval(refreshAllVisuals, 2500);
    window.findNearestInfra = findNearestInfra;
    window.KYIV_INFRA = { bridges: KYIV_BRIDGES, energy: ENERGY_DB, infrastructure: INFRASTRUCTURE_OBJECTS, incidents: INCIDENT_OBJECTS, power: KYIV_SUBSTATIONS };
    window.RadarParse = { extractDroneId, parseTarget, parseEvents, estimateAltitude, formatAltRange, estimateSpeedKmh, detectCategory, hasMovement, CLASSIFIER, detectExactName, estimateKinematics, observedSpeedFromPoints, predictPosition, predictTowardKyiv, kinematicsFor, resolveSpeedKmh, etaToKyivMin, KINEMATICS, detectMessageRole, geometryGate, resolveTrailKey, typeBucket, geoGridKey, UAV_ACC, normalizeChannel, uniqueChannels, uniqueChannelCount, confirmStats, inKyivOblast, TrackIds, VIS_FLAGS };
    console.log("[radar] ready. v15.6 — visual enhancements integrated");
  } catch (e) { RadarLog.push("init", e.message, e); RadarLog.showBanner("init: " + (e && e.message || e)); }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
